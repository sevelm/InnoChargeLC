; Link: E:\Users\Penner\Documents\Software-SPS\VS-Code\InnoChargeLC\InnoChargeLC\.pio\build\esp32-s3-devkitc-1


[env:esp32-s3-devkitc-1]
board_build.partitions = partitions_bigspiffs.csv
platform = espressif32@6.6.0
board = esp32-s3-evse
framework = arduino
monitor_speed = 115200
monitor_port = COM4
upload_port = COM4
lib_deps = 
	makuna/NeoPixelBus @ 2.8.4
	esphome/ESPAsyncWebServer-esphome @ ^3.2.2
	bblanchon/ArduinoJson @ 7.2.2
	links2004/WebSockets @ 2.4.1
	matth-x/MicroOcpp @ 1.2.0
	emelianov/modbus-esp8266 @ ^4.1.0
lib_ignore = ArduinoJson@6.20.1
build_flags =
	-D MO_ENABLE_V201=0
monitor_filters = COM4
board_build.filesystem = spiffs
extra_scripts = pre:versioning.py, post:copy_out.py 
