<script>(() => {
  'use strict';
  let state = 'C';
  let maximum = 11;
  let power = 5.5;
  let phase = 'Three-phase';
  const sockets = new Set();
  let clockOffset = 0;
  const visuals = {
    A: ['Ready to connect', '#0000ff', 'solid'],
    B: ['Vehicle connected', '#ffc300', 'solid'],
    C: ['Charging', '#00ff00', 'charge'],
    D: ['Charging - ventilation', '#00ff00', 'charge'],
    E: ['Charging error', '#ff0000', 'solid'],
    F: ['Charger fault', '#ff0000', 'blink'],
    paused: ['Charging paused', '#ff00ff', 'solid'],
    authorization: ['Waiting for authorization', '#ffc300', 'wave']
  };

  function snapshot() {
    const paused = power === 0 && ['C', 'D'].includes(state);
    const [label, color, animation] = visuals[paused ? 'paused' : state];
    return {
      wallboxName: 'InnoCharge',
      cpState: 'State ' + ({paused: 'B', authorization: 'B'}[state] || state),
      phaseMode: phase,
      vehicleConnected: !['A', 'E', 'F'].includes(state),
      chargingActive: ['C', 'D'].includes(state) && !paused,
      targetChargePower: power === 0 ? 0 : Math.max(1.4, power),
      maxChargePower: maximum,
      ledStatus: {
        label, color, waveColor: animation === 'wave' ? '#ffffff' : color,
        animation, periodMs: animation === 'blink' ? 500 : 2800
      }
    };
  }

  function publish() {
    const data = JSON.stringify(snapshot());
    for (const socket of sockets) {
      if (socket.readyState === 1 && socket.subscribed) {
        socket.onmessage?.({data});
      }
    }
    const connection = document.getElementById('connection');
    if (connection) connection.textContent = 'simulation';
  }

  // Never instantiate or retain the platform WebSocket. CSP also denies network I/O.
  class DemoSocket {
    static CONNECTING = 0;
    static OPEN = 1;
    static CLOSING = 2;
    static CLOSED = 3;
    readyState = 0;
    subscribed = false;

    constructor() {
      sockets.add(this);
      setTimeout(() => {
        if (this.readyState !== 0) return;
        this.readyState = 1;
        this.onopen?.();
      }, 0);
    }

    send(text) {
      if (this.readyState !== 1) return;
      const command = JSON.parse(text);
      if (command.action === 'requestAppTime' || command.action === 'setDeviceTime') {
        let ok = true;
        if (command.action === 'setDeviceTime') {
          let epoch = command.epoch;
          if (command.localDateTime) {
            // Iterate the Vienna wall-clock offset without depending on the phone timezone.
            const format = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Vienna', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
            const target = Date.parse(command.localDateTime + 'Z');
            epoch = target / 1000;
            for (let i = 0; i < 3; ++i) {
              const local = format.format(new Date(epoch * 1000)).replace(' ', 'T');
              epoch += (target - Date.parse(local + 'Z')) / 1000;
            }
          }
          ok = Number.isFinite(epoch) && epoch > 1700000000;
          if (ok) clockOffset = epoch * 1000 - Date.now();
          setTimeout(() => this.onmessage?.({data: JSON.stringify({type:'deviceTimeStatus',ok,message:ok?'Time updated.':'Failed to set time.'})}), 0);
        } else {
          const epoch = Math.floor((Date.now() + clockOffset) / 1000);
          const format = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Vienna', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
          setTimeout(() => this.onmessage?.({data: JSON.stringify({type:'appTime',epoch,localDateTime:format.format(new Date(epoch * 1000)).replace(' ', 'T')})}), 0);
        }
        return;
      }
      if (command.action === 'requestAppSessions') {
        const rows = Array.from({length: 46}, (_, index) => ({
          transactionId: 100 - index,
          active: index === 0,
          userName: ['Alex', 'Maria', 'Garage'][index % 3],
          idTag: 'DEMO' + String(index % 3 + 1),
          startTimeEpoch: 1794812400 - index * 86400,
          startTime: new Date((1794812400 - index * 86400) * 1000).toISOString(),
          stopTime: new Date((1794812400 - index * 86400 + 5400) * 1000).toISOString(),
          durationSeconds: 5400 + index * 30,
          energyWh: 8000 + index * 125,
          ocppTransactionId: null, ocppStart: 'none', ocppStop: 'none', ocppIdTag: '',
          stopReason: index === 0 ? '' : 'EVDisconnected'
        }));
        setTimeout(() => this.onmessage?.({data: JSON.stringify({
          type: 'appSessions', ok: true, requestId: command.requestId,
          wallboxName: 'InnoCharge DEMO', sessionRevision: 1, sessionTotal: rows.length,
          sessionOffset: command.offset, sessionLimit: 20,
          sessions: rows.slice(command.offset, command.offset + 20)
        })}), 0);
        return;
      }
      if (command.action === 'subscribeUpdates') this.subscribed = true;
      if (command.action === 'unsubscribeUpdates') this.subscribed = false;
      if (command.action === 'setChargeParameters' &&
          Number.isFinite(command.power) && command.power >= 0 && command.power <= maximum) {
        power = Math.round(command.power * 10) / 10;
      }
      setTimeout(publish, 0);
    }

    close() {
      if (this.readyState === 3) return;
      this.readyState = 3;
      sockets.delete(this);
      this.onclose?.();
    }
  }
  Object.defineProperty(window, 'WebSocket', {value: DemoSocket, writable: false, configurable: false});

  let heartbeat;
  window.InnoChargeDemoReset = () => {
    state = 'C'; maximum = 11; power = 5.5; phase = 'Three-phase'; clockOffset = 0;
    document.getElementById('demoState').value = state;
    document.getElementById('demoMaximum').value = String(maximum);
    document.getElementById('demoPhase').value = phase;
    publish();
  };
  window.addEventListener('DOMContentLoaded', () => {
    const style = document.createElement('style');
    style.textContent = `
      .demo-settings { margin: 0 0 16px; padding: 12px 0; border: 0; border-bottom: 1px solid var(--line); min-width: 0; }
      .demo-settings legend { padding: 0; color: var(--blue); font-size: 13px; font-weight: 700; }
      .demo-options { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
      .demo-options label:first-child { grid-column: 1 / -1; }
      .demo-options label { display: grid; gap: 5px; min-width: 0; font-size: 12px; color: var(--muted); }
      .demo-options select { width: 100%; min-width: 0; height: 44px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); font: inherit; font-size: 14px; }
    `;
    document.head.append(style);
    const settings = document.createElement('fieldset');
    settings.className = 'demo-settings';
    settings.innerHTML = `
      <legend>DEMO / Simulated data</legend>
      <div class="demo-options">
        <label>Simulated state<select id="demoState">
          <option value="A">A - Ready to connect</option>
          <option value="B">B - Vehicle connected</option>
          <option value="C" selected>C - Charging</option>
          <option value="D">D - Charging with ventilation</option>
          <option value="paused">Charging paused</option>
          <option value="authorization">Waiting for authorization</option>
          <option value="E">E - Charging error</option>
          <option value="F">F - Charger fault</option>
        </select></label>
        <label>Wallbox limit<select id="demoMaximum"><option value="11">11 kW</option><option value="22">22 kW</option></select></label>
        <label>Phase mode<select id="demoPhase"><option>Three-phase</option><option>Single-phase</option></select></label>
      </div>
    `;
    document.querySelector('header').after(settings);
    document.getElementById('demoState').addEventListener('change', event => {
      state = event.target.value;
      publish();
    });
    document.getElementById('demoMaximum').addEventListener('change', event => {
      maximum = Number(event.target.value);
      power = Math.min(power, maximum);
      publish();
    });
    document.getElementById('demoPhase').addEventListener('change', event => {
      phase = event.target.value;
      publish();
    });
    heartbeat = setInterval(publish, 4000);
  });
  window.addEventListener('pagehide', () => clearInterval(heartbeat));
  window.addEventListener('pageshow', event => {
    if (event.persisted) heartbeat = setInterval(publish, 4000);
  });
})();
</script></head>

  <script>
    'use strict';
    const APP_CLIENT = 'innocharge-public-app';
    const byId = id => document.getElementById(id);
    const field = byId('setChargePower');
    const range = byId('powerRange');
    const controls = byId('powerControls');
    const numberFormat = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    let socket;
    let reconnectTimer;
    let staleTimer;
    let stopped = false;
    let initialized = false;
    let maxPower = null;
    let reportedPower = 0;
    let hasVisual = false;

    function drawPowerArc() {
      const percent = maxPower ? Math.max(0, Math.min(100, reportedPower / maxPower * 100)) : 0;
      const dash = percent + ' ' + (100 - percent);
      byId('ringProgress').setAttribute('stroke-dasharray', dash);
      byId('ringMaskArc').setAttribute('stroke-dasharray', dash);
      byId('powerRing').dataset.powerPercent = String(percent);
    }

    // Hardware colors remain unchanged; only the display uses this softer palette.
    function displayLedColor(color) {
      const palette = {
        '#0000ff': '#588fc7', '#578fc7': '#588fc7', '#588fc7': '#588fc7',
        '#00ff00': '#75b995', '#ffc300': '#d5ad70', '#ff0000': '#d77e83',
        '#ff00ff': '#ad91c9', '#ffffff': '#dce5eb', '#000000': '#263238'
      };
      const key = color.toLowerCase();
      if (palette[key]) return palette[key];
      // Preserve the hue of custom Modbus colors while reducing saturation.
      return '#' + key.slice(1).match(/../g).map(channel =>
        Math.round(parseInt(channel, 16) * 0.55 + 144 * 0.45).toString(16).padStart(2, '0')
      ).join('');
    }

    function applyLedStatus(status) {
      if (!status || typeof status.label !== 'string' || !/^#[0-9a-f]{6}$/i.test(status.color) ||
          !/^#[0-9a-f]{6}$/i.test(status.waveColor) || !['solid', 'wave', 'charge', 'blink'].includes(status.animation)) return false;
      const ring = byId('powerRing');
      ring.style.setProperty('--state-color', displayLedColor(status.color));
      ring.style.setProperty('--wave-color', displayLedColor(status.waveColor));
      const period = Number.isFinite(status.periodMs) && status.periodMs >= 200 && status.periodMs <= 10000 ? status.periodMs : 2800;
      ring.style.setProperty('--period', period + 'ms');
      ring.dataset.animation = status.animation;
      byId('chargeStatus').textContent = status.label;
      return true;
    }

    function showMessage(text, error = false) {
      byId('message').textContent = text;
      byId('message').classList.toggle('error', error);
    }

    function clearStatus() {
      initialized = false;
      maxPower = null;
      reportedPower = 0;
      hasVisual = false;
      controls.disabled = true;
      field.max = range.max = '0';
      byId('maxPowerLabel').textContent = '\u2013 kW';
      byId('chargeStatus').textContent = 'Offline';
      byId('powerRing').dataset.animation = 'solid';
      byId('powerRing').style.setProperty('--state-color', '#588fc7');
      drawPowerArc();
      byId('app').classList.remove('has-data');
      ['targetChargePower', 'cpState', 'phaseMode', 'vehicleConnected', 'chargingActive'].forEach(id => {
        byId(id).textContent = '\u2013';
        byId(id).classList.remove('active');
      });
      field.value = '';
      range.value = '0';
    }

    function setConnection(online) {
      byId('connection').textContent = online ? 'online' : 'offline';
      byId('connection').classList.toggle('online', online);
      window.dispatchEvent(new CustomEvent('innocharge-connection', { detail: online }));
      if (!online) {
        clearTimeout(staleTimer);
        clearStatus();
      }
    }

    function sendMessage(message) {
      if (!socket || socket.readyState !== WebSocket.OPEN) return false;
      try {
        socket.send(JSON.stringify({ client: APP_CLIENT, ...message }));
        return true;
      } catch (_) {
        return false;
      }
    }

    function setInput(value) {
      value = Math.max(0, Math.min(maxPower ?? 0, value));
      field.value = value.toFixed(1);
      range.value = String(value);
      field.removeAttribute('aria-invalid');
      byId('decreasePower').disabled = value <= 0;
      byId('increasePower').disabled = maxPower === null || value >= maxPower;
    }

    function processUpdate(data) {
      if (!data || typeof data !== 'object') return;
      if (typeof data.wallboxName === 'string') {
        const name = data.wallboxName.trim();
        byId('wallboxName').textContent = name;
        byId('wallboxName').hidden = !name || name.toLowerCase() === 'innocharge';
      }
      if (data.maxChargePower === 11 || data.maxChargePower === 22) {
        const changed = maxPower !== data.maxChargePower;
        maxPower = data.maxChargePower;
        field.max = range.max = String(maxPower);
        byId('maxPowerLabel').textContent = maxPower + ' kW';
        if (changed && initialized && Number.isFinite(field.valueAsNumber)) setInput(field.valueAsNumber);
      } else if (Object.prototype.hasOwnProperty.call(data, 'maxChargePower')) {
        maxPower = null;
        initialized = false;
        controls.disabled = true;
        field.max = range.max = '0';
        byId('maxPowerLabel').textContent = '\u2013 kW';
      }
      if (Object.prototype.hasOwnProperty.call(data, 'ledStatus')) hasVisual = applyLedStatus(data.ledStatus);
      ['cpState', 'phaseMode'].forEach(id => {
        if (typeof data[id] === 'string') byId(id).textContent = data[id];
      });
      ['vehicleConnected', 'chargingActive'].forEach(id => {
        if (typeof data[id] !== 'boolean') return;
        byId(id).textContent = data[id] ? 'yes' : 'no';
        byId(id).classList.toggle('active', data[id]);
      });
      if (typeof data.targetChargePower === 'number' && Number.isFinite(data.targetChargePower) && data.targetChargePower >= 0 && data.targetChargePower <= 22) {
        byId('targetChargePower').textContent = numberFormat.format(data.targetChargePower);
        reportedPower = data.targetChargePower;
        drawPowerArc();
        byId('app').classList.add('has-data');
        controls.disabled = maxPower === null;
        // The effective CP power may differ from the user's requested power.
        if (!initialized && maxPower !== null) {
          setInput(data.targetChargePower);
          initialized = true;
          showMessage('');
        }
        if (maxPower === null || !hasVisual) {
          byId('chargeStatus').textContent = 'Status unavailable';
          byId('powerRing').dataset.animation = 'solid';
          showMessage('Firmware-Update fuer Ladegrenze und LED-Status erforderlich.', true);
        }
        clearTimeout(staleTimer);
        staleTimer = setTimeout(() => {
          clearStatus();
          showMessage('Keine aktuellen Daten von der Wallbox.', true);
          if (socket) socket.close();
        }, 15000);
      }
    }

    function commitPower() {
      if (controls.disabled) return;
      const value = field.valueAsNumber;
      if (!Number.isFinite(value) || !field.validity.valid) {
        field.setAttribute('aria-invalid', 'true');
        showMessage('Bitte 0 bis ' + maxPower + ' kW in Schritten von 0,1 eingeben.', true);
        return;
      }
      setInput(value);
      if (sendMessage({ action: 'setChargeParameters', power: value })) {
        showMessage('');
      } else {
        setConnection(false);
        showMessage('Keine Verbindung zur Wallbox.', true);
      }
    }

    function stepPower(delta) {
      const value = field.valueAsNumber;
      if (!Number.isFinite(value)) { commitPower(); return; }
      setInput(Math.max(0, Math.min(maxPower, Math.round((value + delta) * 10) / 10)));
      commitPower();
    }

    function connect() {
      clearTimeout(reconnectTimer);
      if (stopped) return;
      if (location.protocol === 'file:') {
        showMessage('Keine Verbindung zur Wallbox.');
        return;
      }
      socket = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.hostname + ':81/');
      socket.onopen = () => {
        setConnection(true);
        showMessage('Warte auf Wallbox-Daten ...');
        sendMessage({ action: 'subscribeUpdates', page: 'app' });
      };
      socket.onmessage = event => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'appSessions') {
            window.dispatchEvent(new CustomEvent('innocharge-sessions-page', { detail: data }));
          } else if (data.type === 'appTime' || data.type === 'deviceTimeStatus') {
            window.dispatchEvent(new CustomEvent('innocharge-time', { detail: data }));
          } else {
            processUpdate(data);
          }
        }
        catch (_) { showMessage('Ungueltige Daten empfangen.', true); }
      };
      socket.onerror = () => {
        setConnection(false);
        showMessage('Keine Verbindung zur Wallbox.', true);
      };
      socket.onclose = () => {
        setConnection(false);
        if (!stopped) {
          showMessage('Verbindung unterbrochen. Verbinde erneut ...', true);
          reconnectTimer = setTimeout(connect, 2500);
        }
      };
    }

    field.addEventListener('change', commitPower);
    field.addEventListener('keydown', event => {
      if (event.key === 'Enter') { event.preventDefault(); field.blur(); }
    });
    range.addEventListener('input', () => { setInput(Number(range.value)); showMessage(''); });
    range.addEventListener('change', commitPower);
    byId('decreasePower').addEventListener('click', () => stepPower(-0.1));
    byId('increasePower').addEventListener('click', () => stepPower(0.1));
    window.addEventListener('pagehide', () => {
      stopped = true;
      clearTimeout(reconnectTimer);
      clearTimeout(staleTimer);
      sendMessage({ action: 'unsubscribeUpdates', page: 'app' });
      if (socket) socket.close();
    });
    window.addEventListener('pageshow', event => {
      if (event.persisted) { stopped = false; setConnection(false); connect(); }
    });
    setConnection(false);
    connect();
  </script>
  <script>(() => {
  'use strict';
  const el = id => document.getElementById(id);
  let sessions = [];
  let complete = false;
  let loading = false;
  let exportBusy = false;
  let visibleCount = 20;
  let descending = true;
  let generation = 0;
  let requestId = 0;
  let pending = null;
  let wallboxName = 'InnoCharge';

  function message(text, error = false) {
    el('appSessionMessage').textContent = text;
    el('appSessionMessage').classList.toggle('error', error);
  }

  function date(value) {
    const parsed = value ? new Date(value) : null;
    return parsed && Number.isFinite(parsed.getTime()) ? parsed : null;
  }

  function time(value) {
    return date(value)?.toLocaleString('de-AT') || 'Time unavailable';
  }

  function duration(value) {
    const seconds = Math.max(0, Math.floor(Number(value) || 0));
    return [Math.floor(seconds / 3600), Math.floor(seconds % 3600 / 60), seconds % 60]
      .map(part => String(part).padStart(2, '0')).join(':');
  }

  function energy(value) {
    return (Math.max(0, Number(value) || 0) / 1000).toLocaleString('de-AT', { minimumFractionDigits: 3, maximumFractionDigits: 3 }) + ' kWh';
  }

  function selection() {
    const from = el('appSessionFrom').value;
    const to = el('appSessionTo').value;
    const user = el('appSessionUser').value.trim().toLowerCase();
    const status = el('appSessionStatus').value;
    const start = from ? new Date(from + 'T00:00:00').getTime() : -Infinity;
    const end = to ? new Date(to + 'T23:59:59.999').getTime() : Infinity;
    const key = el('appSessionSort').value;
    return sessions.filter(session => {
      const stamp = date(session.startTime)?.getTime();
      if ((from || to) && (!Number.isFinite(stamp) || stamp < start || stamp > end)) return false;
      if (status !== 'all' && Boolean(session.active) !== (status === 'active')) return false;
      return !user || [session.userName, session.idTag].some(value => String(value || '').toLowerCase().includes(user));
    }).sort((a, b) => {
      const av = key === 'userName' ? String(a[key] || '') : Number(a[key]) || 0;
      const bv = key === 'userName' ? String(b[key] || '') : Number(b[key]) || 0;
      const comparison = key === 'userName' ? av.localeCompare(bv) : av - bv;
      return (comparison || Number(a.transactionId) - Number(b.transactionId)) * (descending ? -1 : 1);
    });
  }

  function node(tag, text, className) {
    const item = document.createElement(tag);
    if (text !== undefined) item.textContent = text;
    if (className) item.className = className;
    return item;
  }

  function render() {
    const selected = selection();
    const list = el('appSessionList');
    list.replaceChildren();
    selected.slice(0, visibleCount).forEach(session => {
      const card = node('details', undefined, 'session-card');
      const summary = node('summary');
      const title = node('div', undefined, 'session-card-title');
      title.append(node('time', time(session.startTime)), node('span', session.active ? 'Active' : 'Closed', 'session-badge' + (session.active ? ' active' : '')));
      const metrics = node('div', undefined, 'session-metrics');
      metrics.append(node('strong', energy(session.energyWh)), node('span', duration(session.durationSeconds)));
      summary.append(title, metrics, node('p', session.userName || session.idTag || 'Session #' + session.transactionId, 'session-user'));
      const details = node('dl', undefined, 'session-details');
      const delivery = value => ({ none: '-', pending: 'Pending', sent: 'Unconfirmed', confirmed: 'Confirmed', uncertain: 'Review', failed: 'Failed' })[value] || '-';
      for (const [label, value] of [
        ['Local ID', session.transactionId], ['User', session.userName], ['RFID', session.idTag],
        ['Start', time(session.startTime)], ['Stop', session.active ? 'Active' : time(session.stopTime)],
        ['Duration', duration(session.durationSeconds)], ['Energy', energy(session.energyWh)],
        ['Stop reason', session.stopReason], ['OCPP ID', session.ocppTransactionId],
        ['OCPP tag', session.ocppIdTag], ['OCPP start', delivery(session.ocppStart)], ['OCPP stop', delivery(session.ocppStop)]
      ]) {
        const row = node('div', undefined, 'status-row');
        row.append(node('dt', label), node('dd', value === null || value === undefined || value === '' ? '-' : String(value)));
        details.append(row);
      }
      card.append(summary, details);
      list.append(card);
    });
    if (!selected.length && !loading) list.append(node('p', complete ? 'No sessions match this selection.' : 'No sessions loaded.', 'session-count'));
    if (!loading) el('appSessionCount').textContent = 'Showing ' + Math.min(visibleCount, selected.length) + ' of ' + selected.length + ' sessions';
    el('sessionLoadMore').hidden = visibleCount >= selected.length;
    el('sessionRefresh').disabled = loading;
    const supported = window.InnoChargeExportSupported === true;
    el('sessionExport').disabled = !complete || !selected.length || !supported || exportBusy;
    el('sessionExport').title = supported ? '' : 'File export is available in the updated mobile app.';
    for (const id of ['appSessionSort', 'sessionSortDirection', 'appSessionFrom', 'appSessionTo', 'appSessionUser', 'appSessionStatus', 'sessionClearFilters']) el(id).disabled = loading;
  }

  function cancelPending(reason) {
    if (!pending) return;
    clearTimeout(pending.timer);
    pending.reject(new Error(reason));
    pending = null;
  }

  function page(offset) {
    return new Promise((resolve, reject) => {
      const id = ++requestId;
      const timer = setTimeout(() => {
        pending = null;
        reject(new Error('Sessions unavailable. Check the connection and MAIN firmware, then Refresh.'));
      }, 8000);
      pending = { id, timer, resolve, reject };
      if (!sendMessage({ action: 'requestAppSessions', offset, requestId: id })) {
        clearTimeout(timer);
        pending = null;
        reject(new Error('No connection to the wallbox.'));
      }
    });
  }

  async function refresh() {
    const current = ++generation;
    cancelPending('Refresh cancelled.');
    complete = false;
    loading = true;
    visibleCount = 20;
    message('');
    try {
      for (let attempt = 0; attempt < 3; ++attempt) {
        sessions = [];
        let revision = null;
        let total = null;
        let offset = 0;
        const ids = new Set();
        let changed = false;
        do {
          if (current !== generation) return;
          const response = await page(offset);
          if (current !== generation) return;
          if (!Number.isInteger(response.sessionRevision) || !Number.isInteger(response.sessionTotal) || response.sessionTotal < 0 || response.sessionTotal > 10000 || response.sessionOffset !== offset || !Array.isArray(response.sessions)) throw new Error('Invalid session history received.');
          if (revision === null) { revision = response.sessionRevision; total = response.sessionTotal; }
          if (revision !== response.sessionRevision || total !== response.sessionTotal) { changed = true; break; }
          wallboxName = typeof response.wallboxName === 'string' ? response.wallboxName : 'InnoCharge';
          for (const session of response.sessions) {
            if (!session || !Number.isInteger(session.transactionId) || ids.has(session.transactionId)) throw new Error('History changed. Please Refresh.');
            ids.add(session.transactionId);
            sessions.push(session);
          }
          offset += response.sessions.length;
          if (offset > total || (!response.sessions.length && offset < total)) throw new Error('Incomplete history received. Please Refresh.');
          el('appSessionCount').textContent = 'Loading sessions: ' + offset + ' / ' + total;
          render();
          if (offset < total) await new Promise(resolve => setTimeout(resolve, 150));
        } while (offset < total);
        if (!changed) {
          complete = true;
          message('');
          break;
        }
        if (attempt === 2) throw new Error('History is changing. Please Refresh in a moment.');
      }
    } catch (error) {
      if (current === generation) message(error.message || 'Could not load the sessions.', true);
    } finally {
      if (current === generation) { loading = false; render(); }
    }
  }

  function showSessions(show) {
    el('chargingPage').hidden = show;
    el('sessionsPage').hidden = !show;
    el('chargingTab').setAttribute('aria-selected', String(!show));
    el('sessionsTab').setAttribute('aria-selected', String(show));
    if (show && !complete && !loading) refresh();
    if (!show && loading) {
      ++generation;
      cancelPending('Refresh cancelled.');
      loading = false;
      render();
    }
    window.scrollTo(0, 0);
  }

  window.addEventListener('innocharge-sessions-page', event => {
    const data = event.detail;
    if (!pending || data.requestId !== pending.id) return;
    const request = pending;
    pending = null;
    clearTimeout(request.timer);
    if (data.ok === true) request.resolve(data);
    else request.reject(new Error(data.message || 'Could not load the sessions.'));
  });
  window.addEventListener('innocharge-export-ready', render);
  window.addEventListener('innocharge-connection', event => {
    if (!event.detail) cancelPending('Connection interrupted. Please Refresh.');
    else if (!el('sessionsPage').hidden && !complete && !loading) refresh();
  });
  window.addEventListener('innocharge-export-result', event => {
    exportBusy = false;
    message(event.detail.message || '', event.detail.ok === false);
    render();
  });
  window.addEventListener('pagehide', () => { ++generation; cancelPending('Page closed.'); });
  el('sessionsTab').addEventListener('click', () => showSessions(true));
  el('chargingTab').addEventListener('click', () => showSessions(false));
  el('sessionRefresh').addEventListener('click', refresh);
  el('sessionLoadMore').addEventListener('click', () => { visibleCount += 20; render(); });
  for (const id of ['appSessionSort', 'appSessionFrom', 'appSessionTo', 'appSessionUser', 'appSessionStatus']) el(id).addEventListener('input', () => { visibleCount = 20; render(); });
  el('sessionSortDirection').addEventListener('click', () => {
    descending = !descending;
    el('sessionSortDirection').textContent = descending ? '↓' : '↑';
    el('sessionSortDirection').setAttribute('aria-label', descending ? 'Sort descending' : 'Sort ascending');
    render();
  });
  el('sessionClearFilters').addEventListener('click', () => {
    for (const id of ['appSessionFrom', 'appSessionTo', 'appSessionUser']) el(id).value = '';
    el('appSessionStatus').value = 'all';
    visibleCount = 20;
    render();
  });
  el('sessionExport').addEventListener('click', () => {
    if (!complete || exportBusy || window.InnoChargeExportSupported !== true) return;
    const selected = selection();
    if (!selected.length) return;
    const filters = [
      el('appSessionFrom').value && 'From ' + el('appSessionFrom').value,
      el('appSessionTo').value && 'To ' + el('appSessionTo').value,
      el('appSessionUser').value.trim() && 'User / RFID: ' + el('appSessionUser').value.trim(),
      el('appSessionStatus').value !== 'all' && 'Status: ' + el('appSessionStatus').value
    ].filter(Boolean);
    const sort = el('appSessionSort').selectedOptions[0].textContent + (descending ? ' descending' : ' ascending');
    exportBusy = true;
    render();
    window.InnoChargeHost.postMessage(JSON.stringify({
      action: 'exportSessions', wallboxName,
      selection: (filters.join(' | ') || 'All sessions') + ' | Sort: ' + sort,
      sessions: selected
    }));
  });
  render();
})();
</script>
  <script>(() => {
  'use strict';
  const el = id => document.getElementById(id);
  const overlay = el('appSettings');
  const input = el('appDeviceDateTime');
  let timer = null;
  let clockTimer = null;
  let ready = false;
  let saving = false;
  let inputDirty = false;
  let deviceEpoch = null;
  let receivedAt = 0;

  function message(text, error = false) {
    el('appTimeMessage').textContent = text;
    el('appTimeMessage').classList.toggle('error', error);
  }

  function busy(value) {
    saving = value;
    el('appSaveTime').disabled = !ready || value;
    el('appUsePhoneTime').disabled = !ready || value;
    input.disabled = value;
  }

  function drawClock() {
    el('appDeviceTime').textContent = deviceEpoch === null ? '–' :
      new Date((deviceEpoch + (performance.now() - receivedAt) / 1000) * 1000)
        .toLocaleString('de-AT', { timeZone: 'Europe/Vienna' });
  }

  function requestTime() {
    clearTimeout(timer);
    ready = false;
    busy(false);
    if (!sendMessage({ action: 'requestAppTime' })) {
      message('Connection lost. Please try again.', true);
      return;
    }
    message('Loading...');
    timer = setTimeout(() => message('Firmware update required for time settings.', true), 8000);
  }

  function close() {
    overlay.hidden = true;
    document.body.classList.remove('settings-open');
    el('nativeMenu').setAttribute('aria-expanded', 'false');
    clearInterval(clockTimer);
    el('nativeMenu').focus();
  }

  function open() {
    overlay.hidden = false;
    document.body.classList.add('settings-open');
    el('nativeMenu').setAttribute('aria-expanded', 'true');
    el('appSwitchWallbox').hidden = !window.InnoChargeHost;
    inputDirty = false;
    if (!saving) requestTime();
    drawClock();
    clearInterval(clockTimer);
    clockTimer = setInterval(drawClock, 1000);
    el('closeAppSettings').focus();
  }

  function save(usePhoneTime) {
    if (!ready || saving) return;
    const payload = { action: 'setDeviceTime' };
    if (usePhoneTime) payload.epoch = Math.floor(Date.now() / 1000);
    else {
      if (!input.reportValidity()) return;
      payload.localDateTime = input.value.length === 16 ? input.value + ':00' : input.value;
    }
    if (!sendMessage(payload)) {
      ready = false;
      busy(false);
      message('Connection lost. Please try again.', true);
      return;
    }
    if (usePhoneTime) inputDirty = false;
    busy(true);
    message('Saving...');
    clearTimeout(timer);
    timer = setTimeout(() => { busy(false); message('No response. Please try again.', true); }, 8000);
  }

  window.addEventListener('innocharge-time', event => {
    const data = event.detail;
    if (data.type === 'appTime') {
      if (!Number.isFinite(data.epoch) || typeof data.localDateTime !== 'string') return;
      clearTimeout(timer);
      ready = true;
      deviceEpoch = data.epoch;
      receivedAt = performance.now();
      if (!inputDirty) input.value = data.localDateTime;
      drawClock();
      busy(false);
      // Preserve a successful save acknowledgement while refreshing the clock.
      if (el('appTimeMessage').textContent === 'Loading...') message('');
    } else if (data.type === 'deviceTimeStatus') {
      if (!saving) return;
      clearTimeout(timer);
      busy(false);
      message(data.message || (data.ok ? 'Time updated.' : 'Failed to set time.'), !data.ok);
      if (data.ok) sendMessage({ action: 'requestAppTime' });
    }
  });
  window.addEventListener('innocharge-connection', event => {
    if (!event.detail) {
      clearTimeout(timer);
      ready = false;
      busy(false);
      if (!overlay.hidden) message('Connection lost. Please try again.', true);
    } else if (!overlay.hidden) requestTime();
  });
  window.addEventListener('pagehide', () => { clearTimeout(timer); clearInterval(clockTimer); });
  el('nativeMenu').addEventListener('click', open);
  el('closeAppSettings').addEventListener('click', close);
  overlay.addEventListener('click', event => { if (event.target === overlay) close(); });
  document.addEventListener('keydown', event => {
    if (overlay.hidden) return;
    if (event.key === 'Escape') { event.preventDefault(); close(); }
    if (event.key !== 'Tab') return;
    const items = [...overlay.querySelectorAll('button:not(:disabled), input:not(:disabled)')].filter(item => !item.hidden);
    const first = items[0], last = items[items.length - 1];
    if (!overlay.contains(document.activeElement)) { event.preventDefault(); first.focus(); }
    else if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });
  input.addEventListener('input', () => { inputDirty = true; });
  el('appSaveTime').addEventListener('click', () => save(false));
  el('appUsePhoneTime').addEventListener('click', () => save(true));
  el('appReload').addEventListener('click', () => {
    if (typeof window.InnoChargeDemoReset === 'function') {
      close();
      window.InnoChargeDemoReset();
    } else window.location.reload();
  });
  el('appSwitchWallbox').addEventListener('click', () => {
    close();
    window.InnoChargeHost?.postMessage(window.InnoChargeNavigationSupported ? 'back' : 'menu');
  });
})();
